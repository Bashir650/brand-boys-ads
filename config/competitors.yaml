# Add one entry per competitor / prospect brand you want to track, plus one
# entry for your own brand (is_own_brand: true). Every entry - own brand
# included - gets pulled from the public Ad Library the same way; is_own_brand
# only controls two things: it's excluded from "winning creative" scoring
# (scoring your own ads against that heuristic isn't useful - you already have
# real performance data for them via the Marketing API), and it's the row
# used to interpret META_AD_ACCOUNT_ID's performance data as "yours" in the
# dashboard.
#
# meta_page_id: numeric Facebook Page ID. Find it via Graph API Explorer:
#   GET /<page-username>?fields=id  (or view page source, search "page_id")
# meta_search_terms: free-text fallback search used against the Ad Library
#   when you don't have the exact page ID yet.
# tiktok_handle: the @handle used to search TikTok's Creative Center (no @).
# notes: free text - e.g. "direct competitor" vs "prospect client, big ad spend"
#   (the same collectors double as lead-gen: any brand running lots of ads for
#   months in the Ad Library is spending real budget and is a warm lead).
competitors:
  - name: "DaMENSCH"
    meta_page_id: ""
    meta_search_terms: "DaMENSCH"
    tiktok_handle: ""
    country: "IN"
    is_own_brand: false
    notes: "direct competitor"

  - name: "XYXX"
    meta_page_id: ""
    meta_search_terms: "XYXX"
    tiktok_handle: ""
    country: "IN"
    is_own_brand: true
    notes: "own brand - shown in the Ad Library view (public data) AND pulled via Marketing API using META_AD_ACCOUNT_ID"

  - name: "BlissClub"
    meta_page_id: ""
    meta_search_terms: "BlissClub"
    tiktok_handle: ""
    country: "IN"
    is_own_brand: false
    notes: "direct competitor"

  - name: "Pant Project"
    meta_page_id: ""
    meta_search_terms: "Pant Project"
    tiktok_handle: ""
    country: "IN"
    is_own_brand: false
    notes: "direct competitor"
